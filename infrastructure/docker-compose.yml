services:
  db:
    image: postgres:16
    container_name: myvontade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myvontade
      POSTGRES_PASSWORD: myvontade_pw
      POSTGRES_DB: myvontade
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    container_name: myvontade-api
    build:
      context: ../backend
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://myvontade:myvontade_pw@db:5432/myvontade
      CHOKIDAR_USEPOLLING: "true"
      FRONTEND_ORIGIN: http://localhost:5173
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL}
    ports:
      - "3001:3001"
    depends_on:
      - db
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules

volumes:
  db_data:
  backend_node_modules:
