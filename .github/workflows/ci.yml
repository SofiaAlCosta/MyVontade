name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + e2e)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myvontade
          POSTGRES_PASSWORD: myvontade_pw
          POSTGRES_DB: myvontade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myvontade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://myvontade:myvontade_pw@localhost:5432/myvontade
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      PORT: 3001
      FRONTEND_ORIGIN: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes end-to-end
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "A API não arrancou a tempo. Logs:"
            cat server.log
            exit 1
          fi
          npm run test:e2e

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
